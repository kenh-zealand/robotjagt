function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
}

// Byggede vægge slås op i feltgitteret (builtAt), så kun de få vægge tæt på tjekkes.
// Før blev ALLE vægge gennemgået hver gang – med mange vægge kunne spillet fryse i op til 12 sekunder.
function builtInBox(ax, ay, bx, by, fn) {
  const c0 = clamp(Math.floor(ax / GS), 0, GW - 1), c1 = clamp(Math.floor(bx / GS), 0, GW - 1);
  const r0 = clamp(Math.floor(ay / GS), 0, GH - 1), r1 = clamp(Math.floor(by / GS), 0, GH - 1);
  for (let cy = r0; cy <= r1; cy++) for (let cx = c0; cx <= c1; cx++) { const w = builtAt[cy * GW + cx]; if (w && fn(w)) return w; }
  return null;
}
function circleHitsRect(x, y, r, w) { const cx = clamp(x, w.x, w.x + w.w), cy = clamp(y, w.y, w.y + w.h); return (x - cx) ** 2 + (y - cy) ** 2 < r * r; }
function hitsWall(x, y, r) {
  for (const w of walls) if (circleHitsRect(x, y, r, w)) return true;
  return !!builtInBox(x - r, y - r, x + r, y + r, w => circleHitsRect(x, y, r, w));
}
// skipBuilt = true for spilleren: man kan selv gå igennem sine egne vægge
function pushOut(o, skipBuilt) {
  for (const w of walls) pushRect(o, w);
  if (!skipBuilt) builtInBox(o.x - o.r - 1, o.y - o.r - 1, o.x + o.r + 1, o.y + o.r + 1, w => { pushRect(o, w); return false; });
  o.x = clamp(o.x, o.r, WORLD.w - o.r); o.y = clamp(o.y, o.r, WORLD.h - o.r);
}
function pushRect(o, w) {
  {
    const cx = clamp(o.x, w.x, w.x + w.w), cy = clamp(o.y, w.y, w.y + w.h);
    const dx = o.x - cx, dy = o.y - cy, d2 = dx * dx + dy * dy;
    if (d2 < o.r * o.r) {
      if (d2 > 1e-4) { const d = Math.sqrt(d2); o.x += dx / d * (o.r - d); o.y += dy / d * (o.r - d); }
      else {
        const l = o.x - w.x, r = w.x + w.w - o.x, t = o.y - w.y, b = w.y + w.h - o.y, m = Math.min(l, r, t, b);
        if (m === l) o.x = w.x - o.r; else if (m === r) o.x = w.x + w.w + o.r;
        else if (m === t) o.y = w.y - o.r; else o.y = w.y + w.h + o.r;
      }
    }
  }
}
// Linje mod rektangel (Liang–Barsky) – uden at oprette nye objekter, så der ikke skabes affald hvert billede
let CT0 = 0, CT1 = 1;
function clipT(p, q) {
  if (p === 0) return q >= 0;
  const t = q / p;
  if (p < 0) { if (t > CT1) return false; if (t > CT0) CT0 = t; }
  else { if (t < CT0) return false; if (t < CT1) CT1 = t; }

function update(dt) {
  if (MP && MP.role === 'client') { mpClientUpdate(dt); return; } // klient: verden kommer fra værten
  time += dt;
  if (robots.length === 0 && !(MP && MP.over)) { waveTimer -= dt; if (waveTimer <= 0) { spawnWave(); waveTimer = 2.5; } }
  else if (robots.length > 0 && !(MP && MP.over)) { // så man ikke kan blive i en bølge og samle powerups i det uendelige
    waveAge += dt;
    lowT = robots.length <= CFG.lowRobots ? lowT + dt : 0;
    if (lowT >= CFG.lowRobotsWait || waveAge >= CFG.maxWaveTime) {
      banner(lowT >= CFG.lowRobotsWait ? 'Næste bølge kommer!' : 'Tiden er gået – næste bølge!'); spawnWave();
    }
  }
  matTimer += dt;
  if (!D.autoMats) matTimer = 0; // Svær: byggematerialer findes kun på banen
  while (matTimer >= matEvery()) { matTimer -= matEvery(); if (materials < matCap()) materials++; }
  for (const w of builtWalls) w.flash = Math.max(0, w.flash - dt);
  flowTimer -= dt;
  if (robots.length && (flowDirty || flowTimer <= 0)) { computeFlow(); flowDirty = false; flowTimer = 0.25; }
  updatePlayer(dt); updatePowerups(dt); updateWeaponDrops(dt); updateGrenades(dt); updateSupplies(dt); updateRobots(dt); updateBullets(dt); updateMissiles(dt); updateMeteors(dt);
  if (bannerT > 0) bannerT -= dt;
  if (MP && MP.role === 'host') mpHostTick(dt);
}

function updatePlayer(dt) {
  const p = player;
  if (p.dead) { p.flash = 0; return; } // multiplayer: nede
  if (MP && MP.menu) { keys.clear(); mouse.down = false; } // multiplayer: menu åben – figuren står stille
  if (p.hookCd > 0) p.hookCd -= dt;
  if (p.hook && updateHook(p, dt)) return; // fiskemand: bliver trukket af harpunen
  if (!adminFree && Object.values(cheats).some(Boolean)) usedAdmin = true; // sikkerhedsnet: snyd slået til = admin-runde
  let mx = 0, my = 0;
  if (keys.has('KeyA') || keys.has('ArrowLeft')) mx--;
  if (keys.has('KeyD') || keys.has('ArrowRight')) mx++;
  if (keys.has('KeyW') || keys.has('ArrowUp')) my--;
  if (keys.has('KeyS') || keys.has('ArrowDown')) my++;

    const dx = touch.move.x - touch.move.sx, dy = touch.move.y - touch.move.sy, l = Math.hypot(dx, dy);
    if (l > 8) { const k = Math.min(1, l / 60); mx = dx / l * k; my = dy / l * k; }

  p.vx = mx * CFG.playerSpeed * (p.speedMul || 1); p.vy = my * CFG.playerSpeed * (p.speedMul || 1);
  if (p.skin === 'rainbow' && (mx || my) && Math.random() < 0.7) { // regnbue-spor efter dig

  }
  if (p.skin === 'ice' && Math.random() < ((mx || my) ? 0.5 : 0.15)) { // is-skin: snefnug
    const life = rand(0.6, 1.1);
    particles.push({ x: p.x + rand(-16, 16), y: p.y + rand(-16, 16), vx: rand(-20, 20), vy: rand(-20, 20), life, max: life, color: ['#ffffff', '#bff3ff', '#8fdcff'][Math.floor(Math.random() * 3)], size: rand(1.5, 3), drag: 0.97 });
  }

  p.wallBan = Math.max(0, (p.wallBan || 0) - dt);
  pushOut(p, p.wallBan <= 0 && !D.wallsSolid); // Svær: man kan ikke gå igennem sine egne vægge
  const insideWall = !!builtInBox(p.x - p.r, p.y - p.r, p.x + p.r, p.y + p.r, w => circleHitsRect(p.x, p.y, p.r * 0.6, w));

  // Let: mellemrum sigter automatisk på nærmeste robot
  const autoTarget = ((!mouse.active && !touch.aim) || (D.spaceAutoAim && keys.has('Space'))) ? nearestVisibleRobot() : null;
  if (autoTarget) {

  if (mouse.rdown) tryBuild(cam.x + mouse.x / zoom, cam.y + mouse.y / zoom, true); // hold højreklik og træk for at bygge flere

    p.hp = Math.min(player.maxHp, p.hp + player.maxHp * CFG.regenRate * dt);

  for (const wd of weaponDrops) {
    if (mpTaken(wd)) continue;
    const W = WEAPONS[wd.type], bob = Math.sin(wd.t * 3) * 4, pulse = 0.5 + 0.5 * Math.sin(wd.t * 5);
    ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(wd.x, wd.y + 20, 22, 7, 0, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 0.25 + 0.25 * pulse; circle(wd.x, wd.y + bob, 34); ctx.fillStyle = '#ffd84a'; ctx.fill(); ctx.globalAlpha = 1;
    circle(wd.x, wd.y + bob, 24); ctx.fillStyle = '#1c2129'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = W.color; ctx.stroke();
    ctx.save(); ctx.translate(wd.x - 20, wd.y + bob); drawGun(wd.type, 0.8); ctx.restore();
    ctx.font = '800 13px system-ui,sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,.7)'; ctx.strokeText(W.name, wd.x, wd.y + bob + 40); ctx.fillStyle = W.color; ctx.fillText(W.name, wd.x, wd.y + bob + 40);
  }
  for (const pu of powerups) {
    const P = POWER[pu.type], bob = Math.sin(pu.t * 3) * 4;
    ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(pu.x, pu.y + 16, 16, 6, 0, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 0.35 + 0.2 * Math.sin(pu.t * 4); circle(pu.x, pu.y + bob, 26); ctx.fillStyle = P.color; ctx.fill(); ctx.globalAlpha = 1;
    if (pu.type === 'ammo') {
      ctx.beginPath(); ctx.moveTo(pu.x, pu.y + bob - 21); ctx.lineTo(pu.x + 16, pu.y + bob); ctx.lineTo(pu.x, pu.y + bob + 21); ctx.lineTo(pu.x - 16, pu.y + bob); ctx.closePath();
    } else circle(pu.x, pu.y + bob, 17);
    ctx.fillStyle = P.color; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = P.dark; ctx.stroke();
    ctx.fillStyle = P.dark; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '900 ' + (P.icon.length > 1 ? 15 : 22) + 'px system-ui,sans-serif'; ctx.fillText(P.icon, pu.x, pu.y + bob + 1);
  }
  for (const r of robots) drawRobot(r);
  for (const r of robots) if (r.hunter) { // forræderen: rød, pulserende ring
    ctx.save(); ctx.strokeStyle = `rgba(255,70,70,${0.55 + 0.35 * Math.sin(time * 8)})`; ctx.lineWidth = 3; circle(r.x, r.y, r.r + 8); ctx.stroke();
    ctx.font = '800 11px system-ui,sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#ff6b5b'; ctx.fillText('😡', r.x, r.y - r.r - 18); ctx.restore();
  }
  for (const r of robots) if (r.slowT > 0) { // frost på nedfrosne robotter
    ctx.save(); ctx.translate(r.x, r.y); ctx.globalAlpha = Math.min(1, r.slowT) * 0.85;
    ctx.strokeStyle = '#bff3ff'; ctx.lineWidth = 2; ctx.shadowColor = '#7fdcff'; ctx.shadowBlur = 8;
    circle(0, 0, r.r + 5); ctx.stroke();
    ctx.rotate(time * 0.6);
    for (let k = 0; k < 6; k++) { ctx.rotate(Math.PI / 3); ctx.beginPath(); ctx.moveTo(0, -r.r - 1); ctx.lineTo(0, -r.r - 10); ctx.moveTo(-3, -r.r - 6); ctx.lineTo(0, -r.r - 9); ctx.lineTo(3, -r.r - 6); ctx.stroke(); }
    ctx.restore();
  }
  mpDrawOthers();
  if (state !== 'over') drawPlayer();

  // Kugler
  for (const b of bullets) {
    const a = Math.atan2(b.vy, b.vx);
    ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(a);
    ctx.fillStyle = b.owner === 'p' || b.team ? (b.strong ? '#ff8a3d' : '#ffd86b') : b.ghost ? '#9fe8ff' : '#ff5a4a';
    if (aprilMode && (b.owner === 'p' || b.april)) { // granat der snurrer
      ctx.rotate(time * 14); ctx.scale(1.5, 1.5); ctx.fillStyle = '#4f7a3a'; circle(0, 0, 6); ctx.fill();
      ctx.fillStyle = '#2a2f38'; ctx.fillRect(-2, -9, 4, 4); ctx.strokeStyle = '#c9d3df'; ctx.lineWidth = 1.5; circle(3, -8, 2.5); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,.35)'; circle(-2, -2, 2); }
    else if (b.plasma) { ctx.globalAlpha = 0.35; ctx.fillStyle = '#7dffcf'; circle(0, 0, 20); ctx.fill(); ctx.globalAlpha = 1; ctx.fillStyle = '#7dffcf'; circle(0, 0, 12); ctx.fill(); ctx.fillStyle = '#ffffff'; circle(0, 0, 5); }
    else if (b.homing) { ctx.fillStyle = '#e8eaee'; rr(-8, -4, 16, 8, 3); ctx.fill(); ctx.fillStyle = '#e8323a'; ctx.beginPath(); ctx.moveTo(8, -4); ctx.lineTo(13, 0); ctx.lineTo(8, 4); ctx.fill(); }
    else if (b.big) { ctx.fillStyle = '#d94dff'; circle(0, 0, 8); ctx.fill(); ctx.fillStyle = '#f5c9ff'; circle(0, 0, 3.5); }
    else if (b.wtype === 'sniper') { ctx.fillStyle = b.strong ? '#ff8a3d' : '#bfefff'; rr(-22, -2.5, 44, 5, 2.5); }
    else if (b.wtype === 'shotgun' || b.wtype === 'minigun') { circle(0, 0, b.strong ? 4.5 : 3.5); }
    else if (b.strong) { rr(-12, -5, 24, 10, 5); } else { rr(-9, -3.5, 18, 7, 3.5); } ctx.fill();
    ctx.restore();
  }

  // Buske (tegnes over spillere, så man gemmer sig i dem)
  for (const b of bushes) {
    const mine = player.hidden === b && state !== 'over';
    ctx.globalAlpha = mine ? 0.55 : 0.96;
    ctx.fillStyle = '#1f5a2a'; for (const o of b.blobs) { circle(o.x, o.y + 4, o.r); ctx.fill(); }
    ctx.fillStyle = '#2f7d3a'; for (const o of b.blobs) { circle(o.x, o.y, o.r); ctx.fill(); }
    ctx.fillStyle = '#3f9a4a'; for (const o of b.blobs) { circle(o.x - o.r * 0.25, o.y - o.r * 0.3, o.r * 0.45); ctx.fill(); }
    ctx.globalAlpha = 1;
  }

  // Missiler
  for (const m of missiles) {
    ctx.save(); ctx.translate(m.x, m.y); ctx.rotate(m.angle);
    ctx.fillStyle = '#c23a2e'; ctx.beginPath(); ctx.moveTo(-14, -9); ctx.lineTo(-6, 0); ctx.lineTo(-14, 9); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#eef0f3'; rr(-14, -5, 26, 10, 4); ctx.fill();
    ctx.fillStyle = '#c23a2e'; ctx.beginPath(); ctx.moveTo(12, -5); ctx.lineTo(20, 0); ctx.lineTo(12, 5); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  // Partikler
  for (const p of particles) {
    const f = p.life / p.max;
    ctx.globalAlpha = f; ctx.fillStyle = p.color; circle(p.x, p.y, p.grow ? p.size * (1.8 - f) : p.size); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Eksplosionsringe (viser missilets radius)
  drawMeteors();
  for (const g of rings) {
    const f = g.t / 0.45;
    ctx.globalAlpha = 1 - f; ctx.lineWidth = 10 * (1 - f) + 2; ctx.strokeStyle = '#ffd86b';
    if (g.tele) ctx.strokeStyle = '#c58cff';
    if (g.meteor) ctx.strokeStyle = '#ff6a3a';
    if (g.grenade) ctx.strokeStyle = '#ffdf6b';
    circle(g.x, g.y, (g.grenade ? CFG.grenadeRadius : g.tele ? 45 : g.meteor ? CFG.ultraMeteorRadius + 10 : g.small ? 200 : CFG.missileRadius + 20) * Math.min(1, f * 1.6)); ctx.stroke();
    ctx.fillStyle = 'rgba(255,170,60,.25)'; ctx.fill();
  }
  ctx.globalAlpha = 1;

  for (const pp of popups) {
    ctx.globalAlpha = clamp(1.4 - pp.t, 0, 1);
    ctx.font = '800 17px system-ui,sans-serif'; ctx.textAlign = 'center'; ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,.7)';
    ctx.strokeText(pp.text, pp.x, pp.y); ctx.fillStyle = pp.color; ctx.fillText(pp.text, pp.x, pp.y);
  }
  ctx.globalAlpha = 1;

  // Super klar: pulserende ring om spilleren
  if (state === 'play' && superCharge >= CFG.superHits) {
    ctx.lineWidth = 3; ctx.strokeStyle = `rgba(255,216,74,${0.55 + 0.35 * Math.sin(time * 8)})`;
    circle(player.x, player.y, player.r + 9 + 2 * Math.sin(time * 8)); ctx.stroke();
  }

  // Livsbarer over robotter og spiller
  for (const r of robots) {
    if (r.type === 'ghost' && !ghostVisible(r)) continue;
    if (r.type === 'ultra') bar(r.x - 90, r.y - r.r - 24, 180, 11, r.hp / r.maxHp, '#ff3d6e');
    else if (r.type === 'boss') bar(r.x - 60, r.y - r.r - 18, 120, 9, r.hp / r.maxHp, '#c44dff');
    else if (r.type === 'mini') bar(r.x - 42, r.y - r.r - 16, 84, 8, r.hp / r.maxHp, '#ff9d3b');
    else bar(r.x - 26, r.y - r.r - 16, 52, 6, r.hp / r.maxHp, '#e2483d');
    if (r.state === 'chase' && r.alertT > 0) label('!', r.x, r.y - r.r - 24, '#ff4a3d');
    else if (r.state === 'search') label('?', r.x, r.y - r.r - 24, '#ffc23d');
  }
  if (state !== 'over' && !player.dead) {
    const p = player;
    bar(p.x - 28, p.y - p.r - 18, 56, 6, p.hp / player.maxHp, hpColor(p.hp / player.maxHp));
    const pw = (56 - (p.maxAmmo - 1) * 2) / p.maxAmmo;
    if (!D.autoReload) { ctx.font = '800 11px system-ui,sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#f0a33a'; ctx.fillText(Math.floor(p.ammo + 1e-6), p.x, p.y + p.r + 11); }
    else for (let i = 0; i < p.maxAmmo; i++) {
      const f = clamp(p.ammo - i, 0, 1), x = p.x - 28 + i * (pw + 2);
      ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(x, p.y + p.r + 8, pw, 5);
      ctx.fillStyle = f >= 1 ? '#f0a33a' : '#9a7445'; ctx.fillRect(x, p.y + p.r + 8, pw * f, 5);
    }
  }
  ctx.restore();

  // Skade-/lavt-liv-effekt
  const hpf = player.hp / player.maxHp;
  if (state === 'play' && hpf < 0.3) {
    const g = ctx.createRadialGradient(VW / 2, VH / 2, Math.min(VW, VH) * 0.35, VW / 2, VH / 2, Math.max(VW, VH) * 0.75);
    g.addColorStop(0, 'rgba(200,20,20,0)'); g.addColorStop(1, `rgba(200,20,20,${0.35 * (1 - hpf / 0.3) + 0.08 * Math.sin(time * 6)})`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);
  }
  if (player.flash > 0) { ctx.fillStyle = `rgba(255,40,40,${player.flash * 1.1})`; ctx.fillRect(0, 0, VW, VH); }

  if (state !== 'menu') drawHUD();
  drawSlots();
  drawJoysticks();
}

function hpColor(f) { return f > 0.5 ? '#45c46e' : f > 0.25 ? '#e0b23c' : '#e2483d'; }
function bar(x, y, w, h, f, color) {
  ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(x - 1, y - 1, w + 2, h + 2);
  ctx.fillStyle = color; ctx.fillRect(x, y, w * clamp(f, 0, 1), h);
}
function label(t, x, y, color) {
  ctx.font = '800 22px system-ui,sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,.7)'; ctx.strokeText(t, x, y); ctx.fillStyle = color; ctx.fillText(t, x, y);
}

function drawBoss(r) {
  ctx.save(); ctx.translate(r.x, r.y);
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(5, 12, r.r + 6, r.r * 0.75, 0, 0, Math.PI * 2); ctx.fill();
  ctx.rotate(r.angle);
  // 3 pistoler
  ctx.fillStyle = '#2b2f36';
  for (const oy of [-20, 0, 20]) ctx.fillRect(30, oy - 5, 34, 10);
  // 2 flammekastere på skuldrene
  for (const side of [-1, 1]) {
    ctx.fillStyle = '#3d2a20'; ctx.fillRect(18, side * 40 - 8, 26, 16);
    ctx.fillStyle = r.flaming ? '#ffb340' : '#7a4a2a'; ctx.fillRect(42, side * 40 - 9, 7, 18);
    circle(-r.r + 4, side * 26, 12); ctx.fillStyle = '#b8322a'; ctx.fill();
  }
  ctx.fillStyle = r.flash > 0 ? '#ffffff' : '#5d4a78'; rr(-r.r, -r.r, r.r * 2, r.r * 2, 14); ctx.fill();
  ctx.lineWidth = 5; ctx.strokeStyle = '#2e2240'; ctx.stroke();
  ctx.fillStyle = '#7a6597'; rr(-r.r + 8, -r.r + 8, 14, r.r * 2 - 16, 5); ctx.fill();
  for (const side of [-1, 1]) { ctx.fillStyle = '#433358'; rr(-14, side * 30 - 9, 30, 18, 5); ctx.fill(); }
  ctx.fillStyle = '#1a1422'; rr(6, -22, 28, 44, 8); ctx.fill();
  ctx.fillStyle = r.state === 'chase' ? '#ff3d3d' : '#ffc23d';
  circle(20, -9, 6); ctx.fill(); circle(20, 9, 6); ctx.fill();
  ctx.restore();
}
function drawMini(r) {
  ctx.save(); ctx.translate(r.x, r.y);
  ctx.fillStyle = 'rgba(0,0,0,.33)'; ctx.beginPath(); ctx.ellipse(4, 10, r.r + 2, r.r * 0.72, 0, 0, Math.PI * 2); ctx.fill();
  ctx.rotate(r.angle);
  ctx.fillStyle = '#2b2f36'; ctx.fillRect(18, -18, 28, 9); ctx.fillRect(18, 9, 28, 9);
  ctx.fillStyle = r.flash > 0 ? '#ffffff' : '#4a6a8a'; rr(-r.r, -r.r, r.r * 2, r.r * 2, 10); ctx.fill();
  ctx.lineWidth = 4; ctx.strokeStyle = '#223448'; ctx.stroke();
  ctx.fillStyle = '#6a8aaa'; rr(-r.r + 6, -r.r + 6, 10, r.r * 2 - 12, 4); ctx.fill();
  ctx.save(); ctx.translate(r.r + 8, 0); ctx.rotate(performance.now() / 1000 * (r.state === 'chase' ? 28 : 8));
  ctx.beginPath();
  for (let k = 0; k < 20; k++) { const a = k / 20 * Math.PI * 2, rad = k % 2 ? 15 : 21; ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad); }
  ctx.closePath(); ctx.fillStyle = '#dfe3e8'; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#6a7078'; ctx.stroke();
  circle(0, 0, 5); ctx.fillStyle = '#555'; ctx.fill(); ctx.restore();
  ctx.fillStyle = '#141c26'; rr(-4, -15, 18, 30, 5); ctx.fill();
  ctx.fillStyle = r.state === 'chase' ? '#ff4a3d' : r.state === 'search' ? '#ffc23d' : '#5fd0ff';
  circle(6, 0, 6); ctx.fill();
  ctx.restore();
}
function ghostVisible(r) { return r.type === 'ghost' && ((time + (r.ghostOff || 0)) % 5) < 2; } // synlig 2 sek. hvert 5. sek.
function drawRobot(r) {
  if (r.type === 'ghost' && !ghostVisible(r)) {
    if (r.flash <= 0) return; // usynlig – men blinker svagt når den bliver ramt
    ctx.save(); ctx.globalAlpha = 0.35; ctx.translate(r.x, r.y); ctx.rotate(r.angle);
    ctx.strokeStyle = '#bfefff'; ctx.lineWidth = 2; rr(-r.r, -r.r, r.r * 2, r.r * 2, 7); ctx.stroke();
    ctx.restore(); return;
  }
  if (r.type === 'ultra') return drawUltra(r);
  if (r.type === 'boss') return drawBoss(r);
  if (r.type === 'mini') return drawMini(r);
  ctx.save(); ctx.translate(r.x, r.y);
  ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(3, 8, r.r, r.r * 0.7, 0, 0, Math.PI * 2); ctx.fill();
  ctx.rotate(r.angle);
  if (r.type === 'tele' && r.teleT > 0) ctx.globalAlpha = 0.3 + 0.5 * Math.abs(Math.sin(performance.now() / 40));
  const look = { ghost: ['#bfe8ff', '#4a7a99', '#9fd3f0'], tele: ['#8a6bd8', '#3e2a78', '#b39cff'], gunner: ['#9aa6b6', '#4d5866', '#7d8999'], saw: ['#c7a07a', '#6b4e36', '#a8825f'], flame: ['#d07a4a', '#7a3a1e', '#b0603a'] }[r.type];
  if (r.type === 'ghost') ctx.globalAlpha = 0.75;
  if (r.type === 'gunner' || r.type === 'tele' || r.type === 'ghost') { ctx.fillStyle = '#3d444e'; ctx.fillRect(12, -5, 22, 10); }
  if (r.type === 'flame') {
    ctx.fillStyle = '#3d2a20'; ctx.fillRect(12, -6, 18, 12);
    ctx.fillStyle = r.flaming ? '#ffb340' : '#7a4a2a'; ctx.fillRect(28, -7, 6, 14);
    circle(-r.r - 2, -9, 8); ctx.fillStyle = '#b8322a'; ctx.fill(); circle(-r.r - 2, 9, 8); ctx.fill();
  }
  ctx.fillStyle = r.flash > 0 ? '#ffffff' : look[0]; rr(-r.r, -r.r, r.r * 2, r.r * 2, 7); ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = look[1]; ctx.stroke();
  ctx.fillStyle = look[2]; ctx.fillRect(-r.r + 5, -r.r + 5, 8, r.r * 2 - 10);
  if (r.type === 'tele') { ctx.strokeStyle = 'rgba(197,140,255,.8)'; ctx.lineWidth = 2; circle(0, 0, r.r + 5 + 2 * Math.sin(performance.now() / 150)); ctx.stroke(); }
  if (r.type === 'saw') {
    ctx.save(); ctx.translate(r.r + 10, 0); ctx.rotate(performance.now() / 1000 * (r.state === 'chase' ? 30 : 8));
    ctx.beginPath();
    for (let k = 0; k < 16; k++) { const a = k / 16 * Math.PI * 2, rad = k % 2 ? 13 : 18; ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad); }
    ctx.closePath(); ctx.fillStyle = '#dfe3e8'; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#6a7078'; ctx.stroke();
    circle(0, 0, 4); ctx.fillStyle = '#555'; ctx.fill();
    ctx.restore();
  }
  ctx.fillStyle = '#20262e'; rr(1, -13, 15, 26, 4); ctx.fill();
  ctx.fillStyle = r.state === 'chase' ? '#ff4a3d' : r.state === 'search' ? '#ffc23d' : '#5fd0ff';
  circle(9, 0, 5); ctx.fill();
  ctx.restore();
}
function drawPlayer() {
  const p = player;
  if (p.dead) { mpDrawDowned(p); return; }
  if (p.hook) { // fiskemand: tov og harpun
    const hx = p.hook.x ?? p.hook[0], hy = p.hook.y ?? p.hook[1], a = Math.atan2(hy - p.y, hx - p.x);
    ctx.save(); ctx.strokeStyle = '#d8c9a8'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(hx, hy); ctx.stroke();
    ctx.translate(hx, hy); ctx.rotate(a); ctx.fillStyle = '#c9d3df'; ctx.strokeStyle = '#5a6472'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(-4, -6); ctx.lineTo(-1, 0); ctx.lineTo(-4, 6); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
  }
  ctx.save(); ctx.translate(p.x, p.y);
  ctx.globalAlpha = p.hidden ? (p.reveal > 0 ? 0.9 : 0.6) : 1;
  ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(3, 7, p.r, p.r * 0.7, 0, 0, Math.PI * 2); ctx.fill();
  if (p.skin === 'ice') { // is: krystaller der drejer langsomt og en kold glød
    ctx.save(); ctx.rotate(-p.angle + time * 0.5); ctx.shadowColor = '#7fdcff'; ctx.shadowBlur = 12;
    for (let k = 0; k < 6; k++) {
      ctx.rotate(Math.PI / 3); const len = p.r + 9 + 3 * Math.sin(time * 3 + k);
      ctx.beginPath(); ctx.moveTo(-4, -p.r + 4); ctx.lineTo(0, -len); ctx.lineTo(4, -p.r + 4); ctx.closePath();
      ctx.fillStyle = k % 2 ? 'rgba(220,250,255,.85)' : 'rgba(140,220,255,.8)'; ctx.fill(); ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 1; ctx.stroke();
    }
    ctx.restore();
  }
  if (p.skin === 'owner') { // ejer: roterende guldstråler og kongelig lilla glød
    ctx.save(); ctx.rotate(-p.angle + time * 0.8); ctx.globalCompositeOperation = 'lighter';
    for (let k = 0; k < 12; k++) {
      const len = p.r + 14 + 6 * Math.sin(time * 5 + k * 1.3);
      ctx.rotate(Math.PI / 6); ctx.beginPath(); ctx.moveTo(-3, 0); ctx.lineTo(0, -len); ctx.lineTo(3, 0); ctx.closePath();
      ctx.fillStyle = k % 2 ? 'rgba(255,216,74,.55)' : 'rgba(180,110,255,.45)'; ctx.fill();
    }
    ctx.restore();
    for (let k = 0; k < 3; k++) { const a = time * 2.4 + k * Math.PI * 2 / 3; // små guldstjerner der kredser
      ctx.fillStyle = '#ffe680'; ctx.shadowColor = '#ffd84a'; ctx.shadowBlur = 10; circle(Math.cos(a) * (p.r + 12), Math.sin(a) * (p.r + 12), 2.5); ctx.fill(); ctx.shadowBlur = 0; }
    if (p.invuln > 0) { ctx.strokeStyle = `rgba(255,216,74,${0.5 + 0.4 * Math.sin(time * 20)})`; ctx.lineWidth = 3; circle(0, 0, p.r + 9); ctx.stroke(); }
  }
  if (p.skin === 'angel') { // engle-vinger: flagrer, glorie og et blødt lys
    const flap = Math.sin(time * 7) * 0.25;
    ctx.save(); ctx.shadowColor = 'rgba(255,245,200,.9)'; ctx.shadowBlur = 18;
    for (const side of [-1, 1]) {
      ctx.save(); ctx.scale(side, 1); ctx.rotate(-flap);
      for (let f = 0; f < 4; f++) { // fjer i lag
        const len = 30 - f * 5, a = -0.55 + f * 0.32;
        ctx.save(); ctx.rotate(a);
        ctx.beginPath(); ctx.moveTo(8, 0); ctx.quadraticCurveTo(8 + len * 0.5, -9, 8 + len, 0); ctx.quadraticCurveTo(8 + len * 0.5, 7, 8, 3); ctx.closePath();
        ctx.fillStyle = f % 2 ? '#f4f1ff' : '#ffffff'; ctx.fill(); ctx.lineWidth = 1; ctx.strokeStyle = '#c9c2e6'; ctx.stroke();
        ctx.restore();
      }
      ctx.restore();
    }
    ctx.restore();

  }

function drawHUD() {
  mpHud();
  // På små skærme skaleres hele HUD'en ned, så den ikke fylder hele telefonen
  const hs = clamp(Math.min(VW / 760, VH / 520), 0.62, 1), realW = VW, realH = VH;
  ctx.save(); ctx.scale(hs, hs); VW = VW / hs; VH = VH / hs;

}

  AMB.nextPing -= dt; if (AMB.nextPing <= 0) { AMB.nextPing = rand(3.5, 8) * (1.1 - 0.5 * L); ambPing(L); }
  if (boss && state === 'play') { AMB.nextBeat -= dt; if (AMB.nextBeat <= 0) { AMB.nextBeat = 1.15 - 0.3 * L; ambBeat(); } }
}
addEventListener('pointerdown', ambStart);
addEventListener('keydown', e => {
  if (e.code === 'KeyM' && !e.repeat && !(e.target && e.target.tagName === 'INPUT') && state !== 'admin' && !(MP && MP.admin)) { ambToggle(); return; }
  if (e.code === 'KeyN' && !e.repeat && !(e.target && e.target.tagName === 'INPUT') && state !== 'admin' && !(MP && MP.admin)) { musToggle(); return; }
  ambStart();
});
document.getElementById('sndbtn').textContent = AMB.on ? '🔊' : '🔇';
document.getElementById('sndbtn').onclick = e => { e.stopPropagation(); ambToggle(); };
document.getElementById('musbtn').onclick = e => { e.stopPropagation(); ambStart(); musToggle(); };

// =====================================================================
// 🔊 Lydeffekter – laves direkte i browseren (Web Audio), ingen lydfiler
// sfx(navn, x, y): lyde fra verden bliver svagere langt væk og kommer fra venstre/højre
// =====================================================================
const SFX = { out: null, noise: null, last: {}, vol: 0.55 };
const SFX_GAP = { spot: 0.15, servo: 0.3, ministep: 0.4, bossstep: 0.55, sawidle: 0.3, beep: 0.5, click: 0.03, w_minigun: 0.045, w_flamer: 0.09, w_rifle: 0.06, hit: 0.03, ric: 0.04, eshot: 0.05, eflame: 0.12, hurt: 0.08, die: 0.03, saw: 0.12, pickup: 0.05, hookhit: 0.05, burnhit: 0.2 };
function sfxInit() {
  const c = AMB.ctx; if (!c || SFX.out) return;
  SFX.out = c.createGain(); SFX.out.gain.value = SFX.vol; SFX.out.connect(AMB.comp || c.destination);
  const b = c.createBuffer(1, c.sampleRate, c.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  SFX.noise = b;
}
function sfxDest(x, y) { // retning og afstand i forhold til din figur
  const c = AMB.ctx, g = c.createGain();
  let v = 1;
  if (x !== undefined) {
    const d = Math.hypot(x - player.x, y - player.y); v = Math.max(0.1, 1 - d / 1100);
    if (c.createStereoPanner) { const pn = c.createStereoPanner(); pn.pan.value = Math.max(-0.9, Math.min(0.9, (x - player.x) / 700)); g.connect(pn); pn.connect(SFX.out); }
    else g.connect(SFX.out);
  } else g.connect(SFX.out);
  g.gain.value = v; return g;
}
function sTone(dest, t, type, f0, f1, dur, vol, attack = 0.004) {
  const c = AMB.ctx, o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(dest); o.start(t); o.stop(t + dur + 0.02);
}
function sNoise(dest, t, ftype, f0, f1, q, dur, vol, attack = 0.002) {
  const c = AMB.ctx, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
  s.buffer = SFX.noise; s.playbackRate.value = 0.8 + Math.random() * 0.4;
  f.type = ftype; f.Q.value = q; f.frequency.setValueAtTime(f0, t); if (f1 !== f0) f.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(dest); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
}
const SFX_DEF = {
  // dine våben
  w_pistol:  (d, t) => { sNoise(d, t, 'bandpass', 2400, 900, 1.2, 0.09, 0.5); sTone(d, t, 'square', 260, 70, 0.08, 0.18); },
  w_rifle:   (d, t) => { sNoise(d, t, 'bandpass', 3000, 1100, 1.4, 0.07, 0.45); sTone(d, t, 'square', 320, 90, 0.06, 0.14); },
  w_minigun: (d, t) => { sNoise(d, t, 'bandpass', 3400, 1500, 1.5, 0.045, 0.32); sTone(d, t, 'square', 200, 90, 0.035, 0.08); },
  w_shotgun: (d, t) => { sNoise(d, t, 'lowpass', 2200, 300, 0.7, 0.28, 0.85); sTone(d, t, 'sine', 120, 40, 0.22, 0.6); },
  w_sniper:  (d, t) => { sNoise(d, t, 'highpass', 4000, 2000, 0.7, 0.05, 0.7); sNoise(d, t + 0.01, 'lowpass', 1400, 120, 0.7, 0.55, 0.45); sTone(d, t, 'sine', 95, 35, 0.35, 0.7); },
  w_flamer:  (d, t) => { sNoise(d, t, 'bandpass', 700, 1100, 0.6, 0.16, 0.35, 0.03); },
  super:     (d, t) => { sNoise(d, t, 'bandpass', 400, 3000, 1, 0.5, 0.6, 0.05); sTone(d, t, 'sawtooth', 120, 520, 0.45, 0.15, 0.04); },
  throw:     (d, t) => { sNoise(d, t, 'bandpass', 600, 1800, 2, 0.22, 0.6, 0.05); },
  hook:      (d, t) => { sNoise(d, t, 'bandpass', 900, 3500, 3, 0.18, 0.4); sTone(d, t, 'triangle', 500, 1400, 0.12, 0.12); },
  hookhit:   (d, t) => { sTone(d, t, 'sine', 160, 50, 0.25, 0.8); sNoise(d, t, 'lowpass', 1800, 200, 0.7, 0.25, 0.7); sTone(d, t, 'square', 900, 600, 0.08, 0.15); },
  build:     (d, t) => { sTone(d, t, 'triangle', 210, 120, 0.1, 0.55); sNoise(d, t, 'lowpass', 900, 300, 1, 0.08, 0.35); },
  wallbreak: (d, t) => { sNoise(d, t, 'bandpass', 700, 200, 0.8, 0.35, 0.7); sTone(d, t, 'triangle', 140, 60, 0.2, 0.4); },
  // robotter
  eshot:     (d, t) => { sTone(d, t, 'square', 720, 260, 0.08, 0.13); sNoise(d, t, 'bandpass', 2000, 900, 2, 0.06, 0.18); },
  eshot2:    (d, t) => { sTone(d, t, 'sawtooth', 300, 90, 0.18, 0.22); sNoise(d, t, 'lowpass', 1600, 300, 1, 0.16, 0.4); },
  plasma:    (d, t) => { sTone(d, t, 'sine', 260, 900, 0.3, 0.35, 0.02); sTone(d, t, 'sine', 265, 910, 0.3, 0.25, 0.02); },
  homing:    (d, t) => { sNoise(d, t, 'bandpass', 500, 1600, 1.5, 0.4, 0.4, 0.05); },
  eflame:    (d, t) => { sNoise(d, t, 'bandpass', 600, 900, 0.6, 0.2, 0.25, 0.04); },
  saw:       (d, t) => { const c = AMB.ctx, o = c.createOscillator(), g = c.createGain(); o.type = 'sawtooth'; o.frequency.setValueAtTime(320, t); o.frequency.linearRampToValueAtTime(380, t + 0.14);
               g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.16, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16); o.connect(g); g.connect(d); o.start(t); o.stop(t + 0.18);
               sNoise(d, t, 'highpass', 3000, 3000, 0.7, 0.12, 0.2); },
  stomp:     (d, t) => { sTone(d, t, 'sine', 90, 28, 0.6, 1); sNoise(d, t, 'lowpass', 600, 80, 0.7, 0.5, 0.8); },
  hit:       (d, t) => { const f = 700 + Math.random() * 300; sTone(d, t, 'square', f, f * 0.8, 0.06, 0.07); sTone(d, t, 'square', f * 1.47, f * 1.2, 0.05, 0.045); sNoise(d, t, 'highpass', 2500, 2500, 0.7, 0.03, 0.1); },
  burnhit:   (d, t) => { sNoise(d, t, 'highpass', 1800, 1800, 0.7, 0.08, 0.12); },
  die:       (d, t) => { sNoise(d, t, 'lowpass', 2600, 160, 0.8, 0.5, 0.75); sTone(d, t, 'sine', 140, 40, 0.4, 0.6); sTone(d, t + 0.02, 'square', 420, 120, 0.15, 0.1); },
  bigdie:    (d, t) => { sNoise(d, t, 'lowpass', 2400, 90, 0.8, 1.0, 1); sTone(d, t, 'sine', 110, 28, 0.9, 0.9); sNoise(d, t + 0.15, 'bandpass', 900, 200, 1, 0.6, 0.4); },
  bossdie:   (d, t) => { for (let k = 0; k < 4; k++) { sNoise(d, t + k * 0.22, 'lowpass', 2400, 80, 0.8, 0.9, 1); sTone(d, t + k * 0.22, 'sine', 120 - k * 15, 26, 0.8, 0.9); } },
  // eksplosioner
  boom:      (d, t) => { sNoise(d, t, 'lowpass', 2200, 70, 0.7, 1.2, 1.2); sTone(d, t, 'sine', 85, 25, 0.9, 1.1); },
  boom2:     (d, t) => { sNoise(d, t, 'lowpass', 2600, 90, 0.7, 0.8, 1); sTone(d, t, 'sine', 100, 30, 0.6, 0.9); },
  // dig
  ric:       (d, t) => { const f = 1800 + Math.random() * 1600; sTone(d, t, 'triangle', f, f * 0.6, 0.06, 0.06); sNoise(d, t, 'highpass', 3500, 3500, 0.7, 0.025, 0.12); },
  hurt:      (d, t) => { sTone(d, t, 'sine', 200, 70, 0.16, 0.7); sNoise(d, t, 'lowpass', 1200, 200, 0.7, 0.12, 0.4); },
  pdie:      (d, t) => { sTone(d, t, 'sawtooth', 300, 40, 1.2, 0.25, 0.02); sNoise(d, t, 'lowpass', 1600, 60, 0.7, 1.0, 0.8); },
  revive:    (d, t) => { [523, 659, 784, 1047].forEach((f, i) => sTone(d, t + i * 0.08, 'sine', f, f, 0.35, 0.22)); },
  alarm:     (d, t) => { for (let k = 0; k < 3; k++) sTone(d, t + k * 0.16, 'square', 880, 660, 0.13, 0.22); },
  pickup:    (d, t) => { [660, 880, 1320].forEach((f, i) => sTone(d, t + i * 0.055, 'sine', f, f, 0.16, 0.22)); },
  weapon:    (d, t) => { sTone(d, t, 'square', 330, 330, 0.08, 0.2); sTone(d, t + 0.08, 'square', 495, 495, 0.14, 0.2); sNoise(d, t, 'bandpass', 2500, 2500, 3, 0.08, 0.2); },
  spot:      (d, t) => { sTone(d, t, 'square', 1200, 1200, 0.06, 0.09); sTone(d, t + 0.08, 'square', 1600, 1600, 0.09, 0.09); },
  tele:      (d, t) => { sTone(d, t, 'sine', 1800, 200, 0.25, 0.2); sTone(d, t, 'triangle', 300, 2400, 0.2, 0.1); },
  servo:     (d, t) => { const f = 180 + Math.random() * 80; sTone(d, t, 'sawtooth', f, f * 1.35, 0.11, 0.05, 0.02); sNoise(d, t, 'bandpass', 900, 1400, 4, 0.08, 0.05); },
  ministep:  (d, t) => { sTone(d, t, 'sine', 110, 55, 0.14, 0.28); sNoise(d, t, 'lowpass', 600, 150, 1, 0.1, 0.12); },
  bossstep:  (d, t) => { sTone(d, t, 'sine', 75, 32, 0.3, 0.55); sNoise(d, t, 'lowpass', 400, 80, 1, 0.22, 0.25); sTone(d, t + 0.02, 'square', 140, 90, 0.08, 0.04); },
  sawidle:   (d, t) => { const c = AMB.ctx, o = c.createOscillator(), g = c.createGain(); o.type = 'sawtooth'; o.frequency.value = 260 + Math.random() * 30;
               g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.05, t + 0.03); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3); o.connect(g); g.connect(d); o.start(t); o.stop(t + 0.32); },
  beep:      (d, t) => { const f = [880, 990, 1320, 740][Math.floor(Math.random() * 4)]; sTone(d, t, 'square', f, f, 0.05, 0.05); sTone(d, t + 0.07, 'square', f * 1.25, f * 1.25, 0.05, 0.04); },
  click:     (d, t) => { sTone(d, t, 'square', 1400, 900, 0.04, 0.12); sNoise(d, t, 'highpass', 4000, 4000, 0.7, 0.02, 0.15); },
  wave:      (d, t) => { sTone(d, t, 'sawtooth', 110, 110, 1.3, 0.12, 0.25); sTone(d, t, 'sawtooth', 164.8, 164.8, 1.3, 0.09, 0.25); sTone(d, t, 'sine', 55, 55, 1.4, 0.4, 0.2); }
};
function sfx(name, x, y) {
  if (!AMB.on || !AMB.ctx || AMB.ctx.state !== 'running') return;
  sfxInit(); const def = SFX_DEF[name]; if (!def) return;
  const now = AMB.ctx.currentTime, gap = SFX_GAP[name] ?? 0.02;
  if (now - (SFX.last[name] ?? -9) < gap) return; // samme lyd ikke for tæt – ellers bliver det støj
  SFX.last[name] = now;
  try { def(sfxDest(x, y), now + 0.005); } catch (e) {}
}

// =====================================================================
// 🎵 Musik – mørk synth i A-mol, laves direkte i browseren
// Menu: rolig flade og arpeggio. I spillet: bas, trommer og arpeggio, der bliver
// kraftigere med flere robotter og går helt amok ved bosser. N slår musikken til og fra.
// =====================================================================
const MUS = { on: lsGet('robotjagt_music', '1') === '1', out: null, next: 0, step: 0, bpm: 112, timer: null, lvl: 0, delay: null };
// Akkorder (A-mol, F, C, E) – grundtoner og akkordtoner i Hz
const MUS_CH = [
  { root: 55, tones: [220, 261.63, 329.63, 440] },   // Am
  { root: 43.65, tones: [174.61, 220, 261.63, 349.23] }, // F
  { root: 65.41, tones: [196, 261.63, 329.63, 392] }, // C
  { root: 41.2, tones: [164.81, 207.65, 246.94, 329.63] } // E (dur – mere spænding)
];
function musInit() {
  const c = AMB.ctx; if (!c || MUS.out) return;
  MUS.out = c.createGain(); MUS.out.gain.value = 0; MUS.out.connect(AMB.comp || c.destination);
  const dl = c.createDelay(1); dl.delayTime.value = 60 / MUS.bpm * 0.75; const fb = c.createGain(); fb.gain.value = 0.32;
  const dlf = c.createBiquadFilter(); dlf.type = 'lowpass'; dlf.frequency.value = 2200;
  dl.connect(dlf); dlf.connect(fb); fb.connect(dl); dlf.connect(MUS.out); MUS.delay = dl;
}
function mNote(t, type, f, dur, vol, cut, dest, attack = 0.005) {
  const c = AMB.ctx, o = c.createOscillator(), fl = c.createBiquadFilter(), g = c.createGain();
  o.type = type; o.frequency.value = f; fl.type = 'lowpass'; fl.frequency.setValueAtTime(cut, t); fl.frequency.exponentialRampToValueAtTime(Math.max(80, cut * 0.3), t + dur);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(fl); fl.connect(g); g.connect(dest || MUS.out); o.start(t); o.stop(t + dur + 0.05);
  return g;
}
function mKick(t, v) { const c = AMB.ctx, o = c.createOscillator(), g = c.createGain(); o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.14);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3); o.connect(g); g.connect(MUS.out); o.start(t); o.stop(t + 0.32); }
function mNoise(t, ftype, f, dur, v) { if (!SFX.noise) sfxInit(); const c = AMB.ctx, s = c.createBufferSource(), fl = c.createBiquadFilter(), g = c.createGain();
  s.buffer = SFX.noise; fl.type = ftype; fl.frequency.value = f; g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(fl); fl.connect(g); g.connect(MUS.out); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02); }
function musStep(t, i) {
  const L = MUS.lvl, bar = Math.floor(i / 16) % 4, s = i % 16, ch = MUS_CH[bar], playing = state === 'play';
  const sixteenth = 60 / MUS.bpm / 4;
  // flade: lang akkord ved starten af hver takt
  if (s === 0) for (const f of ch.tones.slice(0, 3)) mNote(t, 'triangle', f / 2, sixteenth * 16, 0.035, 900, null, 0.4);
  // arpeggio (med ekko) – altid, men kraftigere i spillet
  if (s % 2 === 0 || L > 0.55) {
    const f = ch.tones[[0, 2, 1, 3, 2, 1, 3, 2][(s >> (L > 0.55 ? 0 : 1)) % 8]] * (L > 0.8 && s % 4 === 3 ? 2 : 1);
    const g = mNote(t, 'square', f, sixteenth * 1.6, 0.018 + 0.02 * L, 1400 + 2400 * L);
    g.connect(MUS.delay);
  }
  if (!playing && state !== 'over') return; // menu: kun flade og arpeggio
  // bas: ottendedele, oktavspring
  if (s % 2 === 0) mNote(t, 'sawtooth', ch.root * (s % 8 === 6 ? 2 : 1), sixteenth * 1.8, 0.09 + 0.05 * L, 380 + 700 * L);
  if (state === 'over') return;
  // trommer
  if (s % 4 === 0 && (L > 0.45 || s % 8 === 0)) mKick(t, 0.45 + 0.25 * L);
  if (L > 0.3 && (s === 4 || s === 12)) mNoise(t, 'bandpass', 1800, 0.16, 0.12 + 0.08 * L);
  if (s % 2 === 0 || L > 0.7) mNoise(t, 'highpass', 7000, s % 4 === 2 ? 0.07 : 0.035, (s % 4 === 2 ? 0.045 : 0.025) * (0.6 + L));
  if (L > 0.85 && s === 14) mNoise(t, 'bandpass', 1800, 0.12, 0.12); // ekstra slag ved bosser
}
function musTick() {
  if (!AMB.ctx || AMB.ctx.state !== 'running') return;
  musInit();
  const c = AMB.ctx, sixteenth = 60 / MUS.bpm / 4;
  const boss = state === 'play' && robots.some(r => r.type === 'boss' || r.type === 'ultra');
  const target = state === 'play' ? (player.dead ? 0.15 : Math.min(1, 0.35 + robots.length * 0.04 + (boss ? 0.5 : 0))) : 0.1;
  MUS.lvl += (target - MUS.lvl) * 0.05;
  const vol = !(AMB.on && MUS.on) ? 0 : state === 'pause' || state === 'admin' || state === 'log' ? 0.25 : 0.6;
  MUS.out.gain.setTargetAtTime(vol, c.currentTime, 0.4);
  if (MUS.next < c.currentTime) MUS.next = c.currentTime + 0.05;
  while (MUS.next < c.currentTime + 0.12) { if (vol > 0) musStep(MUS.next, MUS.step); MUS.next += sixteenth; MUS.step++; }
}
function musToggle() {
  MUS.on = !MUS.on; lsSet('robotjagt_music', MUS.on ? '1' : '0');
  const b = document.getElementById('musbtn'); if (b) b.style.opacity = MUS.on ? 1 : 0.45;
}
setInterval(() => { try { musTick(); } catch (e) {} }, 25);
document.getElementById('musbtn').style.opacity = MUS.on ? 1 : 0.45;

// Robotternes egne lyde: servoer og skridt fra de nærmeste, summende save
let robSoundT = 0;
function robotSounds(dt) {
  if (state !== 'play' || !robots.length) return;
  robSoundT -= dt; if (robSoundT > 0) return; robSoundT = 0.12;
  let best = null, bd = 650;
  for (const r of robots) { const d = Math.hypot(r.x - player.x, r.y - player.y); if (d < bd) { bd = d; best = r; } }
  if (!best) return;
  if (best.type === 'boss' || best.type === 'ultra') sfx('bossstep', best.x, best.y);
  else if (best.type === 'mini') sfx('ministep', best.x, best.y);
  else if (best.type === 'saw' && bd < 380) sfx('sawidle', best.x, best.y);
  else sfx('servo', best.x, best.y);
  if (Math.random() < 0.08) sfx('beep', best.x, best.y);
}
document.addEventListener('click', e => { if (e.target && e.target.closest && e.target.closest('button')) { ambStart(); sfx('click'); } }, true);

let last = performance.now();
// En fejl i ét billede må ikke stoppe hele spillet: næste billede bestilles først, og fejl fanges og vises kort.
let errShownAt = -99;
function reportError(e) {
  try { console.error('Robotjagt-fejl:', e); localStorage.setItem('robotjagt_lasterror', new Date().toISOString() + ' v' + VERSION + ': ' + (e && e.stack || e)); } catch (er) {}
  const nowS = performance.now() / 1000;
  if (nowS - errShownAt > 5) { errShownAt = nowS; popups.push({ x: player.x, y: player.y - 80, text: 'Der skete en fejl – spillet kører videre', color: '#ff9a8a', t: 0 }); }
}
addEventListener('error', e => reportError(e.error || e.message));
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  try { if (state === 'play') update(dt); } catch (e) { reportError(e); }
  try { if (state !== 'pause' && state !== 'admin' && state !== 'log') updateParticles(dt); } catch (e) { reportError(e); }
  try { ambTick(dt); robotSounds(dt); } catch (e) {}
  try { draw(); } catch (e) { reportError(e); try { ctx.restore(); ctx.setTransform(DPR, 0, 0, DPR, 0, 0); } catch (er) {} }
  document.getElementById('foot').classList.toggle('hidden', state === 'play' && isTouch);
}
reset(); menu();
requestAnimationFrame(loop);
})();
</script>
