function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);

}

let seed = 7;
const srand = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
for (const b of bushes) {
  b.blobs = [];

    const r = 26 + srand() * 16;
    b.blobs.push({ x: b.x + r * 0.6 + srand() * (b.w - r * 1.2), y: b.y + r * 0.6 + srand() * (b.h - r * 1.2), r });

}

let builtWalls = []; // vægge spilleren har bygget

function hitsWall(x, y, r) {
  for (const w of walls.concat(builtWalls)) {
    const cx = clamp(x, w.x, w.x + w.w), cy = clamp(y, w.y, w.y + w.h);
    if ((x - cx) ** 2 + (y - cy) ** 2 < r * r) return true;
  }
  return false;

// skipBuilt = true for spilleren: man kan selv gå igennem sine egne vægge
function pushOut(o, skipBuilt) {
  for (const w of (skipBuilt ? walls : walls.concat(builtWalls))) {
    const cx = clamp(o.x, w.x, w.x + w.w), cy = clamp(o.y, w.y, w.y + w.h);
    const dx = o.x - cx, dy = o.y - cy, d2 = dx * dx + dy * dy;
    if (d2 < o.r * o.r) {
      if (d2 > 1e-4) { const d = Math.sqrt(d2); o.x += dx / d * (o.r - d); o.y += dy / d * (o.r - d); }
      else {

    const a = Math.atan2(b.vy, b.vx);
    ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(a);
    ctx.fillStyle = b.owner === 'p' ? (b.strong ? '#ff8a3d' : '#ffd86b') : b.ghost ? '#9fe8ff' : '#ff5a4a';
    if (b.homing) { ctx.fillStyle = '#e8eaee'; rr(-8, -4, 16, 8, 3); ctx.fill(); ctx.fillStyle = '#e8323a'; ctx.beginPath(); ctx.moveTo(8, -4); ctx.lineTo(13, 0); ctx.lineTo(8, 4); ctx.fill(); }
    else if (b.big) { ctx.fillStyle = '#d94dff'; circle(0, 0, 8); ctx.fill(); ctx.fillStyle = '#f5c9ff'; circle(0, 0, 3.5); }
    else if (b.wtype === 'sniper') { ctx.fillStyle = b.strong ? '#ff8a3d' : '#bfefff'; rr(-22, -2.5, 44, 5, 2.5); }
    else if (b.wtype === 'shotgun' || b.wtype === 'minigun') { circle(0, 0, b.strong ? 4.5 : 3.5); }
    else if (b.strong) { rr(-12, -5, 24, 10, 5); } else { rr(-9, -3.5, 18, 7, 3.5); } ctx.fill();
    ctx.restore();
  }

  // Buske (tegnes over spillere, så man gemmer sig i dem)
  for (const b of bushes) {
    const mine = player.hidden === b && state !== 'over';
    ctx.globalAlpha = mine ? 0.55 : 0.96;
    ctx.fillStyle = '#1f5a2a'; for (const o of b.blobs) { circle(o.x, o.y + 4, o.r); ctx.fill(); }
    ctx.fillStyle = '#2f7d3a'; for (const o of b.blobs) { circle(o.x, o.y, o.r); ctx.fill(); }
    ctx.fillStyle = '#3f9a4a'; for (const o of b.blobs) { circle(o.x - o.r * 0.25, o.y - o.r * 0.3, o.r * 0.45); ctx.fill(); }
    ctx.globalAlpha = 1;
  }

  // Missiler
  for (const m of missiles) {
    ctx.save(); ctx.translate(m.x, m.y); ctx.rotate(m.angle);
    ctx.fillStyle = '#c23a2e'; ctx.beginPath(); ctx.moveTo(-14, -9); ctx.lineTo(-6, 0); ctx.lineTo(-14, 9); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#eef0f3'; rr(-14, -5, 26, 10, 4); ctx.fill();
    ctx.fillStyle = '#c23a2e'; ctx.beginPath(); ctx.moveTo(12, -5); ctx.lineTo(20, 0); ctx.lineTo(12, 5); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  // Partikler
  for (const p of particles) {
    const f = p.life / p.max;
    ctx.globalAlpha = f; ctx.fillStyle = p.color; circle(p.x, p.y, p.grow ? p.size * (1.8 - f) : p.size); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Eksplosionsringe (viser missilets radius)
  for (const g of rings) {
    const f = g.t / 0.45;
    ctx.globalAlpha = 1 - f; ctx.lineWidth = 10 * (1 - f) + 2; ctx.strokeStyle = '#ffd86b';
    if (g.tele) ctx.strokeStyle = '#c58cff';
    circle(g.x, g.y, (g.tele ? 45 : g.small ? 200 : CFG.missileRadius + 20) * Math.min(1, f * 1.6)); ctx.stroke();
    ctx.fillStyle = 'rgba(255,170,60,.25)'; ctx.fill();
  }
  ctx.globalAlpha = 1;

  for (const pp of popups) {
    ctx.globalAlpha = clamp(1.4 - pp.t, 0, 1);
    ctx.font = '800 17px system-ui,sans-serif'; ctx.textAlign = 'center'; ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,.7)';
    ctx.strokeText(pp.text, pp.x, pp.y); ctx.fillStyle = pp.color; ctx.fillText(pp.text, pp.x, pp.y);
  }
  ctx.globalAlpha = 1;

  // Super klar: pulserende ring om spilleren

    ctx.lineWidth = 3; ctx.strokeStyle = `rgba(255,216,74,${0.55 + 0.35 * Math.sin(time * 8)})`;
    circle(player.x, player.y, player.r + 9 + 2 * Math.sin(time * 8)); ctx.stroke();
  }

  // Livsbarer over robotter og spiller
  for (const r of robots) {
    if (r.type === 'ghost') continue;
    if (r.type === 'boss') bar(r.x - 60, r.y - r.r - 18, 120, 9, r.hp / r.maxHp, '#c44dff');
    else if (r.type === 'mini') bar(r.x - 42, r.y - r.r - 16, 84, 8, r.hp / r.maxHp, '#ff9d3b');
    else bar(r.x - 26, r.y - r.r - 16, 52, 6, r.hp / r.maxHp, '#e2483d');
    if (r.state === 'chase' && r.alertT > 0) label('!', r.x, r.y - r.r - 24, '#ff4a3d');
    else if (r.state === 'search') label('?', r.x, r.y - r.r - 24, '#ffc23d');
  }
  if (state !== 'over') {
    const p = player;
    bar(p.x - 28, p.y - p.r - 18, 56, 6, p.hp / player.maxHp, hpColor(p.hp / player.maxHp));
    const pw = (56 - (p.maxAmmo - 1) * 2) / p.maxAmmo;
    for (let i = 0; i < p.maxAmmo; i++) {
      const f = clamp(p.ammo - i, 0, 1), x = p.x - 28 + i * (pw + 2);
      ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(x, p.y + p.r + 8, pw, 5);

    }

  ctx.restore();

  // Skade-/lavt-liv-effekt
  const hpf = player.hp / player.maxHp;
  if (state === 'play' && hpf < 0.3) {
    const g = ctx.createRadialGradient(VW / 2, VH / 2, Math.min(VW, VH) * 0.35, VW / 2, VH / 2, Math.max(VW, VH) * 0.75);
    g.addColorStop(0, 'rgba(200,20,20,0)'); g.addColorStop(1, `rgba(200,20,20,${0.35 * (1 - hpf / 0.3) + 0.08 * Math.sin(time * 6)})`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);
  }
  if (player.flash > 0) { ctx.fillStyle = `rgba(255,40,40,${player.flash * 1.1})`; ctx.fillRect(0, 0, VW, VH); }

  if (state !== 'menu') drawHUD();
  drawSlots();
  drawJoysticks();
}

function hpColor(f) { return f > 0.5 ? '#45c46e' : f > 0.25 ? '#e0b23c' : '#e2483d'; }
function bar(x, y, w, h, f, color) {

  ctx.fillStyle = color; ctx.fillRect(x, y, w * clamp(f, 0, 1), h);
}
function label(t, x, y, color) {
  ctx.font = '800 22px system-ui,sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,.7)'; ctx.strokeText(t, x, y); ctx.fillStyle = color; ctx.fillText(t, x, y);
}

function drawBoss(r) {

function drawRobot(r) {

  }
  ctx.fillStyle = r.flash > 0 ? '#ffffff' : look[0]; rr(-r.r, -r.r, r.r * 2, r.r * 2, 7); ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = look[1]; ctx.stroke();

}
function drawPlayer() {
  const p = player;
  ctx.save(); ctx.translate(p.x, p.y);
  ctx.globalAlpha = p.hidden ? (p.reveal > 0 ? 0.9 : 0.6) : 1;
  ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(3, 7, p.r, p.r * 0.7, 0, 0, Math.PI * 2); ctx.fill();

function drawHUD() {
  // På små skærme skaleres hele HUD'en ned, så den ikke fylder hele telefonen
  const hs = clamp(Math.min(VW / 760, VH / 520), 0.62, 1), realW = VW, realH = VH;
  ctx.save(); ctx.scale(hs, hs); VW = VW / hs; VH = VH / hs;
  try { drawHUDInner(); } finally { ctx.restore(); VW = realW; VH = realH; }
}
function drawHUDInner() {
  const p = player, x = 18, y = 18, w = Math.min(300, VW - 190);
  ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(13,16,20,.75)'; rr(x - 10, y - 10, w + 20, 160, 12); ctx.fill();

  // Liv
  const f = p.hp / player.maxHp;
  ctx.fillStyle = '#3a1f24'; rr(x, y, w, 24, 6); ctx.fill();
  ctx.fillStyle = hpColor(f); rr(x, y, Math.max(12, w * f), 24, 6); ctx.fill();
  ctx.font = '800 14px system-ui,sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
  ctx.fillText(`${Math.ceil(p.hp)} / ${player.maxHp}`, x + w / 2, y + 12.5);

  // Regenerering
  const since = time - p.lastHit;
  ctx.font = '600 12.5px system-ui,sans-serif'; ctx.textAlign = 'left';
  if (p.hp >= player.maxHp) { ctx.fillStyle = '#93a0b0'; ctx.fillText('Fuldt liv', x, y + 40); }
  else if (since >= CFG.regenDelay) { ctx.fillStyle = '#6fe39a'; ctx.fillText('Regenererer  +20 % pr. sekund', x, y + 40); }
  else {
    ctx.fillStyle = '#93a0b0'; ctx.fillText(`Regenerering om ${(CFG.regenDelay - since).toFixed(1)} s`, x, y + 40);
    ctx.fillStyle = '#2b333d'; ctx.fillRect(x + 168, y + 37, w - 168, 6);
    ctx.fillStyle = '#6fe39a'; ctx.fillRect(x + 168, y + 37, (w - 168) * (since / CFG.regenDelay), 6);
  }

  // Skud
  ctx.fillStyle = WEAPONS[p.weapon].color; ctx.font = '800 11.5px system-ui,sans-serif'; ctx.fillText(WEAPONS[p.weapon].name.toUpperCase(), x, y + 68);
  const gap = p.maxAmmo > 5 ? 4 : 8, sw = (w - 66 - (p.maxAmmo - 1) * gap) / p.maxAmmo;
  for (let i = 0; i < p.maxAmmo; i++) {
    const fx = x + 66 + i * (sw + gap), af = clamp(p.ammo - i, 0, 1);
    ctx.fillStyle = '#2b333d'; rr(fx, y + 59, sw, 18, 5); ctx.fill();
    if (af > 0) { ctx.fillStyle = af >= 1 ? '#f0a33a' : '#8f6a3c'; rr(fx, y + 59, Math.max(6, sw * af), 18, Math.min(5, sw / 2)); ctx.fill(); }
  }

  // Super
  const ready = superCharge >= CFG.superHits;
  ctx.textAlign = 'left'; ctx.font = '700 12.5px system-ui,sans-serif';
  ctx.fillStyle = ready ? '#ffd84a' : '#c9d3df'; ctx.fillText('SUPER', x, y + 98);
  const segW = (w - 52 - 9 * 3) / 10;
  for (let i = 0; i < CFG.superHits; i++) {
    const fx = x + 52 + i * (segW + 3);
    ctx.fillStyle = i < superCharge ? (ready ? `rgba(255,216,74,${0.75 + 0.25 * Math.sin(time * 8)})` : '#d9b33a') : '#2b333d';
    rr(fx, y + 91, segW, 14, 3); ctx.fill();
  }
  if (ready) {
    ctx.font = '800 12px system-ui,sans-serif'; ctx.fillStyle = '#ffd84a';
    ctx.fillText(isTouch ? 'MISSIL KLAR – tryk på knappen' : 'MISSIL KLAR – tryk Q', x, y + 142);
  }
  // Byggemateriale
  ctx.textAlign = 'left'; ctx.font = '700 12.5px system-ui,sans-serif'; ctx.fillStyle = '#e6c08a'; ctx.fillText('BYG', x, y + 121);
  ctx.fillStyle = '#9a6a38'; rr(x + 52, y + 113, 16, 16, 3); ctx.fill(); ctx.strokeStyle = '#5e3d1c'; ctx.lineWidth = 2; ctx.stroke();
  ctx.font = '800 14px system-ui,sans-serif'; ctx.fillStyle = '#fff'; ctx.fillText(`× ${materials}`, x + 74, y + 121);
  ctx.font = '600 12px system-ui,sans-serif'; ctx.fillStyle = '#93a0b0';
  ctx.fillText(materials >= CFG.maxMaterials ? '(fuld)' : isTouch ? '· BYG-knappen' : '· højreklik for at bygge', x + 112, y + 121);

  // Skjult-status
  if (p.hidden && state === 'play') {
    const t = p.reveal > 0 ? 'Afsløret – du skød!' : 'Skjult i busken';
    ctx.font = '700 13px system-ui,sans-serif';
    const tw = ctx.measureText(t).width + 26;
    ctx.fillStyle = p.reveal > 0 ? 'rgba(160,60,30,.85)' : 'rgba(40,120,60,.85)'; rr(x - 10, y + 160, tw, 28, 14); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillText(t, x + 3, y + 174.5);
  }
  let by = y + (p.hidden && state === 'play' ? 194 : 160);
  for (const [k, txt] of [['damage', 'Dobbelt skade'], ['reload', 'Hurtig genladning']]) {
    if (buffs[k] <= 0) continue;
    const t = `${txt}  ${buffs[k].toFixed(1)} s`;
    ctx.font = '700 13px system-ui,sans-serif'; ctx.textAlign = 'left';
    const tw = ctx.measureText(t).width + 26;
    ctx.fillStyle = POWER[k].dark; rr(x - 10, by, tw, 28, 14); ctx.fill();
    ctx.fillStyle = POWER[k].color; rr(x - 10, by, tw * (buffs[k] / CFG.buffTime), 4, 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillText(t, x + 3, by + 14.5);
    by += 34;
  }

  // Øverst til højre
  ctx.textAlign = 'right'; ctx.font = '800 16px system-ui,sans-serif';
  const lines = [`Bølge ${wave}`, `Robotter: ${robots.length}`, `Nedlagt: ${kills}`];
  const extraColors = [];
  if (p.dmgMul > 1) { lines.push(`Skade: +${Math.round((p.dmgMul - 1) * 100)} %`); extraColors.push('#c99bff'); }
  if (adminMode) { lines.push('ADMIN-TILSTAND'); extraColors.push('#ffd84a'); }
  if (p.rateMul > 1) { lines.push(`Skudhast.: +${Math.round((p.rateMul - 1) * 100)} %`); extraColors.push('#6ff0e2'); }
  ctx.fillStyle = 'rgba(13,16,20,.75)'; rr(VW - 170, 8, 162, 82 + (lines.length - 3) * 23, 12); ctx.fill();
  lines.forEach((l, i) => { ctx.fillStyle = i === 0 ? '#fff' : i >= 3 ? extraColors[i - 3] : '#c9d3df'; ctx.font = (i === 0 ? '800 17px' : '600 14px') + ' system-ui,sans-serif'; ctx.fillText(l, VW - 20, 30 + i * 23); });

  const boss = robots.find(r => r.type === 'boss');
  if (boss) {
    const bw = Math.min(460, VW - 360 > 220 ? VW - 360 : VW - 40), bx = VW / 2 - bw / 2, byy = isTouch || VW < 760 ? VH - 100 : 18;
    ctx.fillStyle = 'rgba(13,16,20,.8)'; rr(bx - 8, byy - 8, bw + 16, 40, 10); ctx.fill();
    ctx.fillStyle = '#2a1b36'; rr(bx, byy, bw, 24, 6); ctx.fill();
    ctx.fillStyle = '#c44dff'; rr(bx, byy, Math.max(12, bw * boss.hp / boss.maxHp), 24, 6); ctx.fill();
    ctx.textAlign = 'center'; ctx.font = '800 14px system-ui,sans-serif'; ctx.fillStyle = '#fff';
    ctx.fillText(`BOSS  ${Math.max(0, Math.ceil(boss.hp))} / ${boss.maxHp}`, VW / 2, byy + 12.5);
  }

  // Bølge-banner
  if (bannerT > 0) {
    ctx.globalAlpha = clamp(bannerT, 0, 1); ctx.textAlign = 'center';
    ctx.font = '900 46px system-ui,sans-serif'; ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(0,0,0,.6)';
    ctx.strokeText(bannerText, VW / 2, VH * 0.28); ctx.fillStyle = '#ffd86b'; ctx.fillText(bannerText, VW / 2, VH * 0.28);
    ctx.globalAlpha = 1;
  }
  if (!isTouch && state === 'play' && time < 6) {
    ctx.textAlign = 'center'; ctx.font = '600 13px system-ui,sans-serif'; ctx.fillStyle = 'rgba(220,230,240,.7)';
    ctx.fillText('P / Esc = pause', VW / 2, VH - 64);
  }
}
function drawJoysticks() {
  if (!isTouch || state !== 'play') return;
  const pb = pauseBtn();
  circle(pb.x, pb.y, 20); ctx.fillStyle = 'rgba(13,16,20,.75)'; ctx.fill();
  ctx.fillStyle = '#dfe7f1'; ctx.fillRect(pb.x - 7, pb.y - 9, 5, 18); ctx.fillRect(pb.x + 2, pb.y - 9, 5, 18);
  const bb = buildBtn();

// På keha.dk deles tavlen af alle spillere. Andre steder gemmes den kun på denne enhed.
const HS_SHARED = /(^|\.)keha\.dk$/.test(location.hostname);
const HS_URL = '/wp-json/robotjagt/v1/scores';
const esc = t => String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const hsSort = (a, b) => (b.kills - a.kills) || (b.wave - a.wave);
function hsLocal() { try { const v = JSON.parse(localStorage.getItem('robotjagt_scores') || '[]'); return Array.isArray(v) ? v : []; } catch (e) { return []; } }
async function hsLoad() {
  if (HS_SHARED) {
    try { const r = await fetch(HS_URL, { cache: 'no-store' }); if (r.ok) return (await r.json()).scores || []; } catch (e) {}
    return null; // kunne ikke hente
  }
  return hsLocal();
}
async function hsSubmit(name, k, w) {
  if (HS_SHARED) {
    const r = await fetch(HS_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, kills: k, wave: w, admin: usedAdmin }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.message || 'Kunne ikke gemme');
    return j.scores || [];
  }
  const list = hsLocal(); list.push({ name, kills: k, wave: w, date: new Date().toISOString().slice(0, 10) });
  list.sort(hsSort); const top = list.slice(0, 10);
  try { localStorage.setItem('robotjagt_scores', JSON.stringify(top)); } catch (e) {}
  return top;
}
function hsQualifies(list, k, w) {
  if (k < 1 || !list) return false;
  if (list.length < 10) return true;
  const last = list[list.length - 1];
  return hsSort({ kills: k, wave: w }, last) < 0;
}
function hsTable(list, mark) {
  const h = '<div class="hs-h">🏆 Top 10</div>';

}

  document.getElementById('admclose').onclick = closeAdmin;
  const lo = document.getElementById('admlogout'); if (lo) lo.onclick = () => { adminUnlocked = false; closeAdmin(); };
  panel.querySelectorAll('[data-a]').forEach(b => b.onclick = () => adminAction(b.dataset.a));
}
function adminAction(a) {
  const p = player;
  const hm = 1 + CFG.hpPerWave * (Math.max(1, wave) - 1);
  if (a === 'god') { cheats.god = !cheats.god; return adminControls(); }
  if (a === 'ammo') { cheats.ammo = !cheats.ammo; return adminControls(); }
  if (a === 'aimbot') { cheats.aimbot = !cheats.aimbot; return adminControls(); }
  if (a.startsWith('w-')) {
    const t = a.slice(2);
    if (t === 'drop') { spawnWeaponDrop(); adminToast('Et våben er lagt på banen'); }
    else { giveWeapon(t); adminToast('Du har nu: ' + WEAPONS[t].name + ' (plads ' + (p.inventory.indexOf(t) + 1) + ')'); }
  }
  if (a === 'mats') { materials += 20; adminToast('Byggemateriale: ' + materials); }
  if (a === 'heal') { p.hp = p.maxHp; adminToast('Liv fyldt op'); }
  if (a === 'super') { superCharge = CFG.superHits; adminToast('Super er klar'); }
  if (a === 'maxhp') { p.maxHp += CFG.maxHpBonus; p.hp += CFG.maxHpBonus; adminToast('Max liv: ' + p.maxHp); }
  if (a === 'permdmg') { p.dmgMul += CFG.permDmgBonus; adminToast('Skade: +' + Math.round((p.dmgMul - 1) * 100) + ' %'); }
  if (a === 'permrate') { p.rateMul += CFG.permRateBonus; adminToast('Skudhastighed: +' + Math.round((p.rateMul - 1) * 100) + ' %'); }
  if (a === 'maxammo') { p.maxAmmo++; p.ammo = p.maxAmmo; adminToast('Skud: ' + p.maxAmmo); }
  if (a === 'killall') { for (const r of robots) burst(r.x, r.y, '#ff9d3b', 20, 300); kills += robots.length; robots.length = 0; bullets = bullets.filter(b => b.owner === 'p'); waveTimer = 2.5; adminToast('Alle robotter er væk'); }
  if (a === 'next') { robots.length = 0; bullets.length = 0; waveTimer = 0.3; adminToast('Næste bølge kommer'); }
  if (a === 'gowave') {
    const n = clamp(parseInt(document.getElementById('admwave').value, 10) || 1, 1, 99);
    robots.length = 0; bullets.length = 0; wave = n - 1; waveTimer = 0.3; adminToast('Bølge ' + n + ' starter, når du går tilbage');
  }
  if (a === 'boss') { const w = wave; if (w < 1) wave = 1; spawnBoss(hm); robots[robots.length - 1].kit = bossKit(Math.max(CFG.bossEvery, wave)); wave = w; adminToast('Boss lavet'); }
  if (a === 'mini') { const w = wave; if (w < 1) wave = 1; spawnMini(hm); wave = w; adminToast('Miniboss lavet'); }
  if (a.startsWith('p-')) {
    const t = a.slice(2);
    const n = clamp(parseInt(document.getElementById('admcount').value, 10) || 1, 1, 50);
    adminCount = n; document.getElementById('admcount').value = n;
    for (let i = 0; i < n; i++) applyPowerup(t, true);
    const status = { heal: `Liv: ${Math.ceil(p.hp)} / ${p.maxHp}`, damage: `Dobbelt skade: ${buffs.damage.toFixed(0)} s`,
      reload: `Hurtig genladning: ${buffs.reload.toFixed(0)} s`, super: 'Super er klar', maxhp: `Max liv: ${p.maxHp}`,
      ammo: `Skud: ${p.maxAmmo}`, permdmg: `Skade: +${Math.round((p.dmgMul - 1) * 100)} %`, permrate: `Skudhastighed: +${Math.round((p.rateMul - 1) * 100)} %` }[t];
    adminToast(`${n} × ${POWER[t].name.replace('!', '')} givet til dig – ${status}`);
  }
}

// ---------- Løkke ----------
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  if (state === 'play') update(dt);
  if (state !== 'pause' && state !== 'admin' && state !== 'log') updateParticles(dt);
  draw();
  document.getElementById('foot').classList.toggle('hidden', state === 'play' && isTouch);
  requestAnimationFrame(loop);
}
reset(); menu();
requestAnimationFrame(loop);
})();
</script>
