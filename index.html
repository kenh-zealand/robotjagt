<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101923">
  <title>Robotjagt — 2D skydespil</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
      background: #101923;
      color: #e8f1f5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 1.25rem;
      background: radial-gradient(ellipse at top, #203747, #101923 70%);
    }

    main {
      width: min(100%, 960px);
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 0.8rem;
    }

    h1 {
      margin: 0;
      color: #74e6c1;
      font-size: clamp(1.7rem, 5vw, 2.6rem);
      letter-spacing: 0.08em;
    }

    header p {
      margin: 0.25rem 0 0;
      color: #a9bdc8;
    }

    .credit {
      color: #a9bdc8;
      font-size: 0.9rem;
      white-space: nowrap;
    }

    .game {
      overflow: hidden;
      border: 1px solid #446071;
      border-radius: 12px;
      box-shadow: 0 18px 60px #0007;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      background: #14232d;
      touch-action: none;
    }

    .instructions {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 0.5rem 1rem;
      padding: 0.8rem 1rem;
      color: #b7c8d0;
      font-size: 0.9rem;
    }

    kbd {
      padding: 0.1rem 0.35rem;
      border: 1px solid #526b79;
      border-radius: 4px;
      color: #e8f1f5;
      font: inherit;
    }

    @media (max-width: 520px) {
      body {
        padding: 0.75rem;
      }

      header {
        align-items: start;
        flex-direction: column;
      }

      .credit {
        font-size: 0.8rem;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>ROBOTJAGT</h1>
        <p>Hold robotterne væk så længe du kan!</p>
      </div>
      <span class="credit">Et 2D skydespil af Johannes</span>
    </header>
    <section class="game" aria-label="Robotjagt-spil">
      <canvas id="game" width="960" height="540" aria-label="Spilleområde"></canvas>
      <div class="instructions">
        <span>Bevæg dig med <kbd>WASD</kbd> eller <kbd>↑↓←→</kbd></span>
        <span>Sigt med musen · Skyd med klik eller <kbd>mellemrum</kbd></span>
        <span>Tryk <kbd>R</kbd> for at starte forfra</span>
      </div>
    </section>
  </main>
  <script>
    (() => {
      const canvas = document.querySelector("#game");
      const ctx = canvas.getContext("2d");
      const width = canvas.width;
      const height = canvas.height;
      const keys = new Set();
      const pointer = { x: width / 2 + 100, y: height / 2, down: false };
      const player = { x: width / 2, y: height / 2, radius: 17, speed: 245 };
      let bullets = [];
      let robots = [];
      let score = 0;
      let lives = 3;
      let cooldown = 0;
      let spawnTimer = 0;
      let hurtTimer = 0;
      let gameOver = false;
      let previousTime = 0;

      function reset() {
        player.x = width / 2;
        player.y = height / 2;
        bullets = [];
        robots = [];
        score = 0;
        lives = 3;
        cooldown = 0;
        spawnTimer = 0;
        hurtTimer = 0;
        gameOver = false;
      }

      function setPointer(event) {
        const bounds = canvas.getBoundingClientRect();
        pointer.x = (event.clientX - bounds.left) * width / bounds.width;
        pointer.y = (event.clientY - bounds.top) * height / bounds.height;
      }

      function shoot() {
        const angle = Math.atan2(pointer.y - player.y, pointer.x - player.x);
        const speed = 520;
        bullets.push({
          x: player.x + Math.cos(angle) * 22,
          y: player.y + Math.sin(angle) * 22,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          radius: 5,
          life: 1.3
        });
        cooldown = 0.2;
      }

      function spawnRobot() {
        const side = Math.floor(Math.random() * 4);
        const robot = { x: 0, y: 0, radius: 16, speed: 48 + Math.min(score, 30) * 2 };
        if (side === 0) { robot.x = Math.random() * width; robot.y = -20; }
        if (side === 1) { robot.x = width + 20; robot.y = Math.random() * height; }
        if (side === 2) { robot.x = Math.random() * width; robot.y = height + 20; }
        if (side === 3) { robot.x = -20; robot.y = Math.random() * height; }
        robots.push(robot);
      }

      function update(delta) {
        if (gameOver) return;
        const moveX = Number(keys.has("ArrowRight") || keys.has("d")) -
          Number(keys.has("ArrowLeft") || keys.has("a"));
        const moveY = Number(keys.has("ArrowDown") || keys.has("s")) -
          Number(keys.has("ArrowUp") || keys.has("w"));
        const length = Math.hypot(moveX, moveY) || 1;
        player.x = Math.max(player.radius, Math.min(width - player.radius,
          player.x + moveX / length * player.speed * delta));
        player.y = Math.max(player.radius, Math.min(height - player.radius,
          player.y + moveY / length * player.speed * delta));

        cooldown -= delta;
        hurtTimer = Math.max(0, hurtTimer - delta);
        if ((pointer.down || keys.has(" ")) && cooldown <= 0) shoot();

        spawnTimer -= delta;
        if (spawnTimer <= 0) {
          spawnRobot();
          spawnTimer = Math.max(0.35, 1.15 - score * 0.018);
        }

        for (const bullet of bullets) {
          bullet.x += bullet.vx * delta;
          bullet.y += bullet.vy * delta;
          bullet.life -= delta;
        }

        for (const robot of robots) {
          const angle = Math.atan2(player.y - robot.y, player.x - robot.x);
          robot.x += Math.cos(angle) * robot.speed * delta;
          robot.y += Math.sin(angle) * robot.speed * delta;
          if (hurtTimer === 0 && Math.hypot(player.x - robot.x, player.y - robot.y) <
              player.radius + robot.radius) {
            lives -= 1;
            hurtTimer = 1;
            robots.splice(robots.indexOf(robot), 1);
            if (lives <= 0) gameOver = true;
            break;
          }
        }

        for (let i = robots.length - 1; i >= 0; i--) {
          const robot = robots[i];
          const hit = bullets.findIndex((bullet) =>
            Math.hypot(bullet.x - robot.x, bullet.y - robot.y) <
            bullet.radius + robot.radius
          );
          if (hit !== -1) {
            robots.splice(i, 1);
            bullets.splice(hit, 1);
            score += 1;
          }
        }
        bullets = bullets.filter((bullet) => bullet.life > 0 &&
          bullet.x > -10 && bullet.x < width + 10 &&
          bullet.y > -10 && bullet.y < height + 10);
      }

      function drawRobot(robot) {
        ctx.save();
        ctx.translate(robot.x, robot.y);
        ctx.fillStyle = "#ed7967";
        ctx.fillRect(-robot.radius, -robot.radius * 0.75, robot.radius * 2, robot.radius * 1.5);
        ctx.fillStyle = "#162630";
        ctx.fillRect(-9, -5, 5, 5);
        ctx.fillRect(4, -5, 5, 5);
        ctx.fillStyle = "#f4c27a";
        ctx.fillRect(-6, 5, 12, 3);
        ctx.fillStyle = "#ed7967";
        ctx.fillRect(-5, -robot.radius - 6, 10, 6);
        ctx.restore();
      }

      function draw() {
        ctx.fillStyle = "#14232d";
        ctx.fillRect(0, 0, width, height);
        ctx.strokeStyle = "#ffffff0b";
        ctx.lineWidth = 1;
        for (let x = 0; x < width; x += 40) {
          ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, height); ctx.stroke();
        }
        for (let y = 0; y < height; y += 40) {
          ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(width, y); ctx.stroke();
        }

        ctx.fillStyle = "#f4c27a";
        for (const bullet of bullets) {
          ctx.beginPath(); ctx.arc(bullet.x, bullet.y, bullet.radius, 0, Math.PI * 2); ctx.fill();
        }
        for (const robot of robots) drawRobot(robot);

        const aim = Math.atan2(pointer.y - player.y, pointer.x - player.x);
        ctx.save();
        ctx.translate(player.x, player.y);
        ctx.rotate(aim);
        ctx.fillStyle = "#74e6c1";
        ctx.fillRect(0, -6, 27, 12);
        ctx.restore();
        ctx.fillStyle = hurtTimer > 0 && Math.floor(hurtTimer * 12) % 2 === 0 ? "#fff" : "#62b8e3";
        ctx.beginPath(); ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#162630";
        ctx.beginPath(); ctx.arc(player.x + Math.cos(aim) * 6, player.y + Math.sin(aim) * 6,
          3, 0, Math.PI * 2); ctx.fill();

        ctx.fillStyle = "#e8f1f5";
        ctx.font = "700 20px system-ui, sans-serif";
        ctx.fillText(`POINT: ${score}`, 22, 34);
        ctx.fillStyle = "#ed7967";
        ctx.fillText(`LIV: ${"♥".repeat(Math.max(0, lives))}`, width - 122, 34);

        if (gameOver) {
          ctx.fillStyle = "#081119cc";
          ctx.fillRect(0, 0, width, height);
          ctx.textAlign = "center";
          ctx.fillStyle = "#74e6c1";
          ctx.font = "700 48px system-ui, sans-serif";
          ctx.fillText("SPILLET ER SLUT", width / 2, height / 2 - 22);
          ctx.fillStyle = "#e8f1f5";
          ctx.font = "22px system-ui, sans-serif";
          ctx.fillText(`Du fik ${score} point · Tryk R for at prøve igen`, width / 2, height / 2 + 25);
          ctx.textAlign = "start";
        }
      }

      function frame(time) {
        const delta = Math.min((time - previousTime) / 1000, 0.04);
        previousTime = time;
        update(delta);
        draw();
        requestAnimationFrame(frame);
      }

      window.addEventListener("keydown", (event) => {
        const key = event.key.toLowerCase();
        if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(key)) {
          event.preventDefault();
        }
        keys.add(key);
        if (key === "r" && gameOver) reset();
      });
      window.addEventListener("keyup", (event) => keys.delete(event.key.toLowerCase()));
      canvas.addEventListener("pointermove", setPointer);
      canvas.addEventListener("pointerdown", (event) => {
        setPointer(event);
        pointer.down = true;
        canvas.setPointerCapture(event.pointerId);
      });
      canvas.addEventListener("pointerup", () => { pointer.down = false; });
      canvas.addEventListener("pointercancel", () => { pointer.down = false; });

      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
